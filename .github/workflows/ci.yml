name: CI

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/FloppyRocket -Force
          Copy-Item bin/Release-windows-x64/Sandbox/FloppyRocket.exe package/FloppyRocket/
          Copy-Item bin/Release-windows-x64/Sandbox/Resources package/FloppyRocket/Resources -Recurse
          Compress-Archive -Path package/FloppyRocket -DestinationPath FloppyRocket-Windows-x64.zip

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: FloppyRocket-Windows-x64
          path: FloppyRocket-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" FloppyRocket-Windows-x64.zip --generate-notes --title "Floppy Rocket ${{ github.ref_name }}"
